name: Build macOS and Windows apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Vet and build engine
        working-directory: engine
        run: |
          go vet ./...
          CGO_ENABLED=0 go build ./...

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build torrent engine (universal)
        run: ./scripts/build-engine.sh

      - name: Generate Xcode project and install VLCKit
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee build/setup.log
          pod install --repo-update 2>&1 | tee -a build/setup.log

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace TorVideoPlayer.xcworkspace \
            -scheme TorVideoPlayer \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: .*Sources|BUILD (SUCCEEDED|FAILED)" || true
          { grep -E "(^|: )error:|The following build commands failed" -A4 build/xcodebuild.log || true; } | cut -c1-300 | head -60 | while IFS= read -r line; do echo "::error::$line"; done
          test -d build/DerivedData/Build/Products/Release/TorVideoPlayer.app

      - name: Sign (ad-hoc) and smoke-test
        run: |
          APP=build/DerivedData/Build/Products/Release/TorVideoPlayer.app
          codesign --force --deep --sign - "$APP"
          cp -R "$APP" build/TorVideoPlayer.app
          lipo -info build/TorVideoPlayer.app/Contents/MacOS/TorVideoPlayer
          lipo -info build/TorVideoPlayer.app/Contents/MacOS/torengine
          ls build/TorVideoPlayer.app/Contents/Frameworks
          # The engine must start and answer on its HTTP port.
          ( sleep 5 | build/TorVideoPlayer.app/Contents/MacOS/torengine -data "$RUNNER_TEMP/tvp" > "$RUNNER_TEMP/engine.out" ) &
          sleep 2
          PORT=$(awk '/LISTENING/{print $2}' "$RUNNER_TEMP/engine.out")
          curl -fsS "http://127.0.0.1:$PORT/health"
          # The app must launch and stay up.
          build/TorVideoPlayer.app/Contents/MacOS/TorVideoPlayer &
          APP_PID=$!
          sleep 8
          kill -0 $APP_PID && echo "App is running"
          kill $APP_PID || true

      - name: Create DMG
        run: ./scripts/make-dmg.sh build/TorVideoPlayer.app

      - name: Report failure details
        if: failure()
        run: |
          for f in build/setup.log build/xcodebuild.log; do
            [ -f "$f" ] || continue
            msg=$( ({ grep -E -A6 "(^|: )error:|failed with exit code|The following build commands failed|No such file" "$f" || true; } | tail -n 60; tail -n 25 "$f") | cut -c1-240 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$f::$msg"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: MediaPlayer-dmg
          path: build/MediaPlayer.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(grep -E 'MARKETING_VERSION' project.yml | head -1 | sed -E 's/[^0-9.]//g')" >> "$GITHUB_OUTPUT"

      - name: Build torrent engine
        shell: bash
        run: ./scripts/build-engine-windows.sh

      - name: Publish app
        run: dotnet publish windows/MediaPlayer/MediaPlayer.csproj -c Release -o build/windows/publish -p:Version=${{ steps.version.outputs.version }}

      - name: Smoke-test
        shell: pwsh
        run: |
          $dir = "build/windows/publish"
          if (-not (Test-Path "$dir/torengine.exe")) { throw "torengine.exe missing" }
          if (-not (Test-Path "$dir/libvlc/win-x64/libvlc.dll")) { throw "libvlc missing" }
          # The engine must start and answer on its HTTP port.
          $psi = New-Object System.Diagnostics.ProcessStartInfo "$dir/torengine.exe"
          $psi.Arguments = "-data `"$env:RUNNER_TEMP\tvp`""
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $engine = [System.Diagnostics.Process]::Start($psi)
          $line = $engine.StandardOutput.ReadLine()
          Write-Host $line
          $port = $line.Split(" ")[1]
          Invoke-WebRequest "http://127.0.0.1:$port/health" -UseBasicParsing | Select-Object -ExpandProperty Content
          $engine.StandardInput.Close()
          if (-not $engine.WaitForExit(5000)) { throw "engine did not exit when stdin closed" }
          # The app must launch (loads LibVLC) and stay up.
          $app = Start-Process -FilePath "$dir/MediaPlayer.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) {
            Get-Content "$env:LOCALAPPDATA/MediaPlayer/crash.log" -ErrorAction SilentlyContinue
            throw "App exited with code $($app.ExitCode)"
          }
          Write-Host "App is running"
          Get-Content "$env:LOCALAPPDATA/MediaPlayer/crash.log" -ErrorAction SilentlyContinue
          Stop-Process -Id $app.Id -Force
          Stop-Process -Name torengine -Force -ErrorAction SilentlyContinue

      - name: Zip portable version
        shell: pwsh
        run: Compress-Archive -Path build/windows/publish/* -DestinationPath build/MediaPlayer-Windows-x64.zip

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} windows/installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: MediaPlayer-windows
          path: |
            build/MediaPlayer-Setup-x64.exe
            build/MediaPlayer-Windows-x64.zip

  release:
    needs: [macos, windows]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Read version
        id: version
        run: echo "version=$(grep -E 'MARKETING_VERSION' project.yml | head -1 | sed -E 's/[^0-9.]//g')" >> "$GITHUB_OUTPUT"

      # Every push to main (re)publishes the release for the current version.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: MediaPlayer ${{ steps.version.outputs.version }}
          files: |
            dist/MediaPlayer.dmg
            dist/MediaPlayer-Setup-x64.exe
            dist/MediaPlayer-Windows-x64.zip
          make_latest: true
          body: |
            MediaPlayer — торрент-плеер на базе VLC с двойными субтитрами: смотрите торренты онлайн, не дожидаясь полной загрузки.

            ### macOS 13+ (Apple Silicon и Intel)
            Скачайте `MediaPlayer.dmg`, перетащите приложение в «Программы», затем один раз выполните в Терминале:
            ```
            xattr -dr com.apple.quarantine "/Applications/MediaPlayer.app"
            ```

            ### Windows 10/11 (64-бит)
            - `MediaPlayer-Setup-x64.exe` — установщик (права администратора не нужны). Windows SmartScreen может предупредить о неизвестном издателе: «Подробнее» → «Выполнить в любом случае».
            - `MediaPlayer-Windows-x64.zip` — портативная версия: распакуйте и запустите `MediaPlayer.exe`.

            Подробности — в [README](https://github.com/Arthuralend/TorVideoPlayer#readme).
